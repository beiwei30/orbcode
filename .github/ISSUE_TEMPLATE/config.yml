# Only the two structured templates; a blank issue skips the fields (version,
# platform, permission configuration) that almost every report here needs.
blank_issues_enabled: false

# Deliberately no Discussions link: Discussions is not enabled on this repo, and
# a dead entry here is worse than no entry. Add one if that changes.
contact_links:
  - name: Usage question — start with the documentation
    url: https://github.com/beiwei30/orbcode/blob/main/docs/README.md
    about: Getting started, flags, configuration, permissions, MCP, feature status, and troubleshooting.

  - name: Contributing, building, running the checks
    url: https://github.com/beiwei30/orbcode/blob/main/CONTRIBUTING.md
    about: How to build, which single command CI runs, and what will fail review.

  - name: Security vulnerability — report it privately
    url: https://github.com/beiwei30/orbcode/security/advisories/new
    about: Permission bypass, sandbox escape, transport auth bypass, credential exposure. Please do not open a public issue.

name: pr-build

# Fast cross-platform binary validation for pull requests. Each platform builds
# exactly once with Cargo's standard debug profile, then every smoke check
# reuses that exact binary. Formal releases use the standard release profile.
# Formal distribution builds live in release.yml and retain Thin LTO plus one
# codegen unit.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "cli/build.rs"
      - "cli/src/build_info.rs"
      - "cli/tests/build_smoke.rs"
      - "scripts/**"
      - ".github/workflows/pr-build.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Preserve the existing PR check names for branch-protection compatibility.
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: ".exe"
    steps:
      - name: Checkout (full history for git SHA metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: debug-${{ matrix.target }}

      - name: Build fast PR binary
        run: cargo build -p orbcode --target ${{ matrix.target }}

      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Binary smoke tests
        shell: bash
        run: scripts/smoke-release.sh --binary target/${{ matrix.target }}/debug/orbcode${{ matrix.bin_suffix }} --expected-target ${{ matrix.target }}

      - name: Cross-platform sandbox host validation
        shell: bash
        run: scripts/ci-cross-platform-smoke.sh --binary target/${{ matrix.target }}/debug/orbcode${{ matrix.bin_suffix }}

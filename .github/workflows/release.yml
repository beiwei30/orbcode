name: release-build

# Cross-platform build matrix for the orbcode binary.
#
# - Builds a release binary on Linux, macOS, and Windows native targets.
# - Runs black-box smoke checks against that exact prebuilt binary on every
#   platform without compiling a separate Rust test harness.
# - Packages a stably-named archive (orbcode-<version>-<target>.<ext>) plus a
#   sha256 checksum and uploads them as workflow artifacts.
#
# Triggers: tag pushes (v*), manual dispatch, and a weekly verification build.
# Pull requests use the faster pr-build.yml workflow. Tag builds additionally
# attach the archives to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 1"

# Read-only by default. Only the `release` job needs `contents: write` (it creates
# the GitHub Release), and it declares that itself.
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-isolation:
    name: feature isolation (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify workspace compiles without default features
        run: cargo check --workspace --no-default-features

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: ".exe"
    steps:
      - name: Checkout (full history for git SHA metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p orbcode --target ${{ matrix.target }}

      - name: Audit ChatGPT auth release boundary
        shell: bash
        run: scripts/audit-chatgpt-auth-release.sh --binary target/${{ matrix.target }}/release/orbcode${{ matrix.bin_suffix }} --target ${{ matrix.target }}

      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04's AppArmor gate prevents bubblewrap from initializing
          # its network namespace on GitHub-hosted runners.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Binary smoke tests
        shell: bash
        run: scripts/smoke-release.sh --binary target/${{ matrix.target }}/release/orbcode${{ matrix.bin_suffix }} --expected-target ${{ matrix.target }}

      - name: Cross-platform sandbox host validation
        shell: bash
        run: scripts/ci-cross-platform-smoke.sh --binary target/${{ matrix.target }}/release/orbcode${{ matrix.bin_suffix }}

      - name: Package release artifact
        shell: bash
        run: scripts/package-release.sh --no-build --target ${{ matrix.target }} --out-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbcode-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true

name: release-build

# Cross-platform build matrix for the orbcode binary.
#
# - Builds a release binary on Linux, macOS, and Windows native targets.
# - Runs the black-box build_smoke integration tests (cli/tests/build_smoke.rs)
#   on every platform.
# - Packages a stably-named archive (orbcode-<version>-<target>.<ext>) plus a
#   sha256 checksum and uploads them as workflow artifacts.
#
# Triggers: tag pushes (v*), manual dispatch, and PRs that touch the build or
# packaging surface. Tag builds additionally attach the archives to a GitHub
# Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "cli/build.rs"
      - "cli/src/build_info.rs"
      - "cli/tests/build_smoke.rs"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - "clients/desktop/**"
      - "clients/typescript/**"
      - "app-server-client/**"
      - "app-server-protocol/**"
      - "docs/host-security.md"
      - "docs/desktop-release-smoke.md"

# Read-only by default. Only the `release` job needs `contents: write` (it creates
# the GitHub Release), and it declares that itself. Keeping the default narrow
# matters because this workflow also runs on pull requests, where the build and
# packaging jobs execute code from the PR.
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-release-evidence:
    name: desktop release evidence (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout (full history for build metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-evidence

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            clients/desktop/package-lock.json

      - name: Install TypeScript client dependencies
        run: npm ci
        working-directory: clients/typescript

      - name: Install desktop dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Type, accessibility, and compatibility gates
        working-directory: clients/desktop
        run: |
          npm run check:types
          npm run build:web
          npm run test:a11y
          npm run test:compat

      - name: Desktop privileged-host tests and lints
        run: |
          cargo fmt --manifest-path clients/desktop/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path clients/desktop/src-tauri/Cargo.toml
          cargo clippy --manifest-path clients/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Child transport and host lifecycle evidence
        run: |
          cargo test -p orbcode-app-server-client
          cargo test -p orbcode --test child_stdio_client_e2e
          cargo test -p orbcode --test host_launcher_e2e
          cargo test -p orbcode --test transport_server_request_e2e

      - name: Required Node and browser protocol evidence
        env:
          ORBCODE_REQUIRE_NODE: "1"
        run: |
          cargo test -p orbcode --test ts_reference_client_e2e -- --ignored --test-threads=1
          cargo test -p orbcode --test local_web_host_e2e -- --ignored --test-threads=1
          cargo test -p orbcode --test desktop_ui_e2e -- --ignored --test-threads=1

      - name: Required remote PTY evidence
        run: cargo test -p orbcode --test tui_remote_pty_e2e -- --ignored --test-threads=1

      - name: Build and audit unsigned desktop bundle
        working-directory: clients/desktop
        run: npm run build:release-app

      - name: Audit desktop bundle contents
        run: scripts/audit-desktop-artifact.sh 'clients/desktop/src-tauri/target/release/bundle/macos/Orbcode Desktop.app'

  feature-isolation:
    name: feature isolation (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify workspace compiles without default features
        run: cargo check --workspace --no-default-features

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout (full history for git SHA metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p orbcode --target ${{ matrix.target }}

      - name: Run build_smoke integration tests
        run: cargo test -p orbcode --test build_smoke --release --target ${{ matrix.target }}

      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04's AppArmor gate prevents bubblewrap from initializing
          # its network namespace on GitHub-hosted runners.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Cross-platform smoke tests (path normalization + sandbox host validation)
        shell: bash
        run: scripts/ci-cross-platform-smoke.sh --release

      # The bash smoke pipeline (version <-> doctor cross-check + TUI startup
      # smoke) runs natively on the Unix runners. Windows relies on the
      # cross-platform cargo build_smoke step above.
      - name: Smoke-release pipeline (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/smoke-release.sh --release

      - name: Package release artifact
        shell: bash
        run: scripts/package-release.sh --no-build --target ${{ matrix.target }} --out-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbcode-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: attach to GitHub Release
    needs: [build, desktop-sign-notarize]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true

  desktop-sign-notarize:
    name: sign and notarize desktop (macOS)
    needs: desktop-release-evidence
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout (full history for build metadata)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-sign-notarize
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}

      - name: Configure notarytool keychain profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: xcrun notarytool store-credentials orbcode-ci --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"

      - name: Install desktop dependencies
        run: npm ci
        working-directory: clients/desktop

      - name: Build desktop app
        run: npm run build:release-app
        working-directory: clients/desktop

      - name: Sign, notarize, staple, and assess
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: orbcode-ci
        run: scripts/sign-notarize-desktop.sh

      - name: Audit signed artifact
        env:
          ORBCODE_REQUIRE_SIGNED: "1"
        run: scripts/audit-desktop-artifact.sh 'clients/desktop/src-tauri/target/release/bundle/macos/Orbcode Desktop.app'

      - name: Upload notarized desktop app
        uses: actions/upload-artifact@v4
        with:
          name: Orbcode-Desktop-macOS
          path: dist/desktop/Orbcode-Desktop.zip
          if-no-files-found: error

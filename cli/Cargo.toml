[package]
name = "orbcode"
version.workspace = true
edition.workspace = true
description = "Orb Code: a native Rust implementation of the Claude Code CLI."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
agent-client-protocol.workspace = true
orbcode-app-server = { path = "../app-server" }
orbcode-app-server-client = { path = "../app-server-client" }
orbcode-app-server-protocol = { path = "../app-server-protocol" }
orbcode-app-server-transport = { path = "../app-server-transport" }
orbcode-config = { path = "../config" }
orbcode-protocol = { path = "../protocol" }
orbcode-tui = { path = "../tui" }
chrono.workspace = true
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# Pulls the mock provider feature into the `orbcode` binary built for the
# stream-json e2e tests so model-error scenarios are driven by a `mock://`
# base URL instead of prompt markers. Feature unification scopes this to test
# builds only.
orbcode-compat-fixtures = { path = "../compat-fixtures" }
orbcode-model-provider = { path = "../model-provider", features = ["mock-provider"] }
libc = "0.2"
tempfile.workspace = true
tokio-tungstenite.workspace = true

[build-dependencies]
chrono = { workspace = true }

[[bin]]
name = "orbcode"
path = "src/main.rs"

[lints]
workspace = true

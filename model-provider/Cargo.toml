[package]
name = "orbcode-model-provider"
version.workspace = true
edition.workspace = true
description = "Streaming HTTP model providers with retry, rate-limit handling and token counting for Orb Code."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[features]
# Compiles the URL-driven mock provider (`mock://...` base URLs) used by the
# retry/fallback/diagnostic test suites. Off in release builds so the mock
# scenarios never ship in the production binary; enabled via dev-dependencies
# in the crates whose tests need it.
mock-provider = []

[dependencies]
async-trait.workspace = true
orbcode-protocol = { path = "../protocol" }
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true

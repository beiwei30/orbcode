[package]
name = "orbcode-config"
version.workspace = true
edition.workspace = true
description = "Settings layering, auth, permission rules, home resolution and managed policy for Orb Code."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = []
# Binary-level OAuth fixtures may override the otherwise fixed OpenAI hosts.
# This feature is intentionally activated only by `orbcode` dev-dependencies.
oauth-test-support = []

[dependencies]
orbcode-protocol = { path = "../protocol" }
base64.workspace = true
chrono.workspace = true
directories.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
walkdir = "2"
wiremock = "0.6"

[lints]
workspace = true

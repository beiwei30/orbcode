[package]
name = "orbcode-desktop"
version = "0.0.1"
edition = "2024"
publish = false
default-run = "orbcode-desktop"

[workspace]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
orbcode-app-server-client = { path = "../../../app-server-client", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "1.48.0", features = ["process", "rt-multi-thread", "sync"] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bin]]
name = "orbcode-desktop-protocol-fixture"
path = "tests/fixtures/protocol_fixture.rs"
test = false
bench = false

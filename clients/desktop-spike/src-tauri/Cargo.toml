[package]
name = "orbcode-desktop-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
orbcode-app-server-protocol = { path = "../../../app-server-protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = [] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }

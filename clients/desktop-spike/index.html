<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbcode Desktop Host Spike</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Architecture spike</p>
      <h1>Canonical protocol over host IPC</h1>
      <p>
        This disposable Tauri shell relays one generated <code>initialize</code>
        envelope to a fixed stdio child, then proves that the child was reaped.
      </p>
      <button id="run-probe" type="button">Run initialize probe</button>
      <p id="status" role="status" aria-live="polite">Ready.</p>
      <pre id="result" aria-label="Probe result"></pre>
    </main>
  </body>
</html>
